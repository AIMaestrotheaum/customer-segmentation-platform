services:

  backend:
    build: .
    container_name: customer-segmentation-backend
    ports:
      - "8000:8000"
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: customer-segmentation-frontend
    ports:
      - "8501:8501"
    command: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - backend